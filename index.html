<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Sisonke Edutech Dashboard</title>

<style>
/* =========================
   AMAZON × FACEBOOK THEME
   FAST & MOBILE-FIRST
   ========================= */
:root {
  --fb-blue: #1877f2;
  --fb-blue-dark: #0f5dc9;
  --amazon-orange: #ff9900;
  --amazon-orange-dark: #e68a00;
  --amazon-dark: #232f3e;
  --amazon-dark-2: #111827;
  --white: #ffffff;
  --soft: #f8fafc;
  --muted: #94a3b8;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  padding: 20px 12px;
  font-family: system-ui, -apple-system, Segoe UI, Inter, sans-serif;
  background: linear-gradient(135deg, var(--amazon-dark), var(--amazon-dark-2));
  color: var(--soft);
}

/* Header */
h1 {
  text-align: center;
  font-size: 24px;
  font-weight: 800;
  margin: 6px 0 2px;
  color: var(--amazon-orange);
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
}

/* Card */
.container {
  max-width: 900px;
  margin: auto;
  background: var(--white);
  color: var(--amazon-dark);
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.45);
}

/* Sections */
.section {
  margin-top: 26px;
  padding-top: 14px;
  border-top: 2px solid rgba(24,119,242,0.18);
}

.section h3 {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 12px;
  color: var(--fb-blue);
}

/* Inputs */
input, select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 2px solid rgba(24,119,242,0.25);
  background: var(--soft);
  color: var(--amazon-dark);
  font-size: 14px;
  margin-bottom: 10px;
  outline: none;
}

input:focus, select:focus {
  border-color: var(--fb-blue);
}

/* Buttons */
button {
  width: 100%;
  padding: 14px;
  border-radius: 16px;
  border: none;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  background: linear-gradient(180deg, var(--fb-blue), var(--fb-blue-dark));
  color: var(--white);
  margin-bottom: 10px;
}

.copy {
  background: linear-gradient(180deg, var(--amazon-orange), var(--amazon-orange-dark));
  color: var(--amazon-dark);
}

.clear {
  background: linear-gradient(180deg, var(--amazon-dark), var(--amazon-dark-2));
  color: var(--soft);
}

/* Textarea */
textarea {
  width: 100%;
  min-height: 240px;
  padding: 16px;
  border-radius: 18px;
  border: 2px solid rgba(255,153,0,0.35);
  background: var(--soft);
  font-family: ui-monospace, Consolas, monospace;
  font-size: 14px;
  line-height: 1.55;
  resize: none;
}

/* Desktop Enhancements */
@media (min-width: 720px) {
  body {
    padding: 32px 20px;
  }

  h1 {
    font-size: 30px;
  }

  .container {
    padding: 28px;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  .row > * {
    flex: 1;
  }

  button {
    width: auto;
    padding: 14px 20px;
  }
}
</style>
</head>

<body>

<h1>📊 Sisonke Edutech</h1>
<div class="subtitle">Fast. Offline. WhatsApp-Ready.</div>

<div class="container">

  <!-- INPUT -->
  <div class="section">
    <h3>➕ Add Record</h3>

    <select id="type">
      <option value="income">💰 Income</option>
      <option value="expense">💸 Expense</option>
      <option value="class">📚 Class Held</option>
      <option value="learner">🎓 New Learner</option>
    </select>

    <div class="row">
      <input type="number" id="amount" placeholder="Amount (R)">
      <input type="text" id="note" placeholder="Note (optional)">
    </div>

    <button onclick="addRecord()">Add Record</button>
  </div>

  <!-- REPORTS -->
  <div class="section">
    <h3>📑 Generate Reports</h3>
    <div class="row">
      <button onclick="generateReport('daily')">Daily</button>
      <button onclick="generateReport('weekly')">Weekly</button>
      <button onclick="generateReport('monthly')">Monthly</button>
    </div>
  </div>

  <!-- OUTPUT -->
  <div class="section">
    <h3>📲 WhatsApp Report</h3>
    <textarea id="output" readonly></textarea>
    <button class="copy" onclick="copyReport()">Copy for WhatsApp</button>
    <button class="clear" onclick="clearData()">Clear All Data</button>
  </div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("sisonkeData")) || [];

function save() {
  localStorage.setItem("sisonkeData", JSON.stringify(data));
}

function addRecord() {
  const type = document.getElementById("type").value;
  const amount = Number(document.getElementById("amount").value || 0);
  const note = document.getElementById("note").value;

  data.push({ type, amount, note, date: new Date().toISOString() });
  save();
  alert("Record added ✔");
}

function filterByDays(days) {
  const now = new Date();
  return data.filter(d => (now - new Date(d.date)) / 86400000 <= days);
}

function generateReport(mode) {
  let records, title;
  if (mode === "daily") { records = filterByDays(1); title = "DAILY REPORT"; }
  else if (mode === "weekly") { records = filterByDays(7); title = "WEEKLY REPORT"; }
  else {
    const n = new Date();
    records = data.filter(d => {
      const t = new Date(d.date);
      return t.getMonth() === n.getMonth() && t.getFullYear() === n.getFullYear();
    });
    title = "MONTHLY REPORT";
  }

  let income = 0, expense = 0, classes = 0, learners = 0;
  records.forEach(r => {
    if (r.type === "income") income += r.amount;
    if (r.type === "expense") expense += r.amount;
    if (r.type === "class") classes++;
    if (r.type === "learner") learners++;
  });

  document.getElementById("output").value =
`📊 SISONKE EDUTECH – ${title}

📚 Classes Held: ${classes}
🎓 New Learners: ${learners}

💰 Income: R${income}
💸 Expenses: R${expense}
💵 Net Balance: R${income - expense}

📅 Generated: ${new Date().toLocaleDateString()}
`;
}

function copyReport() {
  const o = document.getElementById("output");
  o.select();
  document.execCommand("copy");
  alert("Copied! Paste into WhatsApp 📲");
}

function clearData() {
  if (confirm("Delete ALL data?")) {
    localStorage.removeItem("sisonkeData");
    data = [];
    alert("Data cleared");
  }
}
</script>

</body>
</html>
