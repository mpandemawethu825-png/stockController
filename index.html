<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Sisonke Edutech Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>
:root {
  --fb-blue: #1877f2;
  --amazon-orange: #ff9900;
  --amazon-dark: #232f3e;
  --white: #ffffff;
  --soft: #f8fafc;
  --muted: #94a3b8;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0; padding: 20px 12px;
  font-family: system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, var(--amazon-dark), #111827);
  color: var(--soft);
}

.container {
  max-width: 800px; margin: auto; background: var(--white);
  color: var(--amazon-dark); padding: 24px; border-radius: 18px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.45);
}

h1 { text-align: center; color: var(--amazon-orange); margin-bottom: 5px; }
.subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 25px; }

.section { margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee; }
.section h3 { font-size: 16px; color: var(--fb-blue); margin-bottom: 12px; }

/* Flexbox Row for inputs */
.row { display: flex; gap: 10px; }

input, select {
  width: 100%; padding: 12px; border-radius: 10px; 
  border: 1px solid #ccc; background: var(--soft);
  margin-bottom: 10px; font-size: 14px;
}

/* Make note expand when amount is hidden */
#note { flex-grow: 1; } 

button {
  width: 100%; padding: 14px; border-radius: 12px; border: none;
  font-weight: bold; cursor: pointer; color: white; margin-bottom: 8px;
  font-size: 14px; transition: opacity 0.2s;
}
button:active { opacity: 0.8; }

.btn-primary { background: var(--fb-blue); }
.btn-whatsapp { background: #25D366; }
.btn-pdf { background: #E1306C; } /* Instagram/PDF color style */
.btn-clear { background: var(--amazon-dark); }

textarea {
  width: 100%; min-height: 140px; padding: 12px; border-radius: 12px;
  background: #f0f2f5; border: 1px solid #ccc; font-family: monospace;
  margin-bottom: 10px;
}

/* Helper to hide elements */
.hidden { display: none !important; }

@media (min-width: 720px) {
  .report-actions { display: flex; gap: 10px; }
}
</style>
</head>

<body>

<h1>📊 Sisonke Edutech</h1>
<div class="subtitle">Secure Data & PDF Reports</div>

<div class="container">

  <div class="section" style="border-top:none; margin-top:0;">
    <h3>➕ Add Record</h3>
    
    <select id="type" onchange="toggleAmount()">
      <option value="income">💰 Income</option>
      <option value="expense">💸 Expense</option>
      <option value="class">📚 Class Held</option>
      <option value="learner">🎓 New Learner</option>
    </select>

    <div class="row">
      <input type="number" id="amount" placeholder="Amount (R)" min="0">
      <input type="text" id="note" placeholder="Description / Name">
    </div>

    <button class="btn-primary" onclick="addRecord()">Add Record</button>
  </div>

  <div class="section">
    <h3>📑 Select Period</h3>
    <div class="row">
      <button class="btn-primary" style="background:#4b5563" onclick="generate('daily')">Today</button>
      <button class="btn-primary" style="background:#4b5563" onclick="generate('weekly')">Last 7 Days</button>
      <button class="btn-primary" style="background:#4b5563" onclick="generate('monthly')">This Month</button>
    </div>
  </div>

  <div class="section">
    <h3>🚀 Actions</h3>
    <textarea id="output" readonly placeholder="Generate a report to see details here..."></textarea>
    
    <div class="report-actions">
        <button class="btn-whatsapp" onclick="copyWhatsApp()">📲 Copy for WhatsApp</button>
        <button class="btn-pdf" onclick="downloadPDF()">📄 Download PDF Report</button>
    </div>
    
    <button class="btn-clear" onclick="clearData()" style="margin-top:15px;">⚠️ Reset All Data</button>
  </div>

</div>

<script>
// Load data
let data = JSON.parse(localStorage.getItem("sisonkeData")) || [];
let currentReportData = []; // Store the currently filtered data for the PDF
let currentTitle = "";

// 1. DYNAMIC INPUT LOGIC (The Fix)
function toggleAmount() {
  const type = document.getElementById("type").value;
  const amountInput = document.getElementById("amount");
  
  // If it is a Class or Learner, hide the money input
  if (type === "class" || type === "learner") {
    amountInput.classList.add("hidden");
    amountInput.value = ""; // Clear value
  } else {
    amountInput.classList.remove("hidden");
  }
}

// 2. ADD RECORD
function addRecord() {
  const type = document.getElementById("type").value;
  const note = document.getElementById("note").value.trim();
  const amountVal = document.getElementById("amount").value;
  const amount = amountVal ? parseFloat(amountVal) : 0;

  // Validation
  if ((type === 'income' || type === 'expense') && amount <= 0) {
    return alert("Please enter a valid amount.");
  }
  if (!note && (type === 'class' || type === 'learner')) {
    return alert("Please enter a note/name.");
  }

  data.push({ type, amount, note, date: new Date().toISOString() });
  localStorage.setItem("sisonkeData", JSON.stringify(data));
  
  // Reset Form
  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
  alert("Saved: " + type.toUpperCase());
}

// 3. GENERATE REPORT (Calculations)
function generate(mode) {
  const now = new Date();
  const todayStr = now.toLocaleDateString();

  if (mode === "daily") {
    currentReportData = data.filter(d => new Date(d.date).toLocaleDateString() === todayStr);
    currentTitle = "Daily Report (" + todayStr + ")";
  } 
  else if (mode === "weekly") {
    const weekAgo = new Date(); weekAgo.setDate(now.getDate() - 7);
    currentReportData = data.filter(d => new Date(d.date) >= weekAgo);
    currentTitle = "Weekly Report (Last 7 Days)";
  } 
  else {
    currentReportData = data.filter(d => {
      const dDate = new Date(d.date);
      return dDate.getMonth() === now.getMonth() && dDate.getFullYear() === now.getFullYear();
    });
    currentTitle = "Monthly Report (" + now.toLocaleString('default', { month: 'long' }) + ")";
  }

  // Calculate Totals
  let income = 0, expense = 0, classes = 0, learners = 0;
  currentReportData.forEach(r => {
    if(r.type === 'income') income += r.amount;
    if(r.type === 'expense') expense += r.amount;
    if(r.type === 'class') classes++;
    if(r.type === 'learner') learners++;
  });

  // Show Text Preview
  document.getElementById("output").value = 
`📊 SISONKE EDUTECH
${currentTitle}
---------------------------
💰 Income:   R${income.toFixed(2)}
💸 Expense:  R${expense.toFixed(2)}
💵 Profit:   R${(income - expense).toFixed(2)}
---------------------------
📚 Classes:  ${classes}
🎓 New Students: ${learners}
---------------------------
Generated: ${now.toLocaleString()}`;
}

// 4. WHATSAPP COPY
function copyWhatsApp() {
  const txt = document.getElementById("output");
  if(!txt.value) return alert("Please click a period button (e.g. 'Today') first.");
  txt.select();
  navigator.clipboard.writeText(txt.value);
  alert("Copied! Paste into WhatsApp.");
}

// 5. PDF GENERATION (New Feature)
function downloadPDF() {
  if(currentReportData.length === 0) return alert("Generate a report first!");
  
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  
  // Header
  doc.setFontSize(22);
  doc.setTextColor(255, 153, 0); // Amazon Orange
  doc.text("Sisonke Edutech", 14, 20);
  
  doc.setFontSize(14);
  doc.setTextColor(40, 40, 40);
  doc.text(currentTitle, 14, 30);
  
  // Summary from Text Area
  const summary = document.getElementById("output").value;
  doc.setFontSize(10);
  doc.text("Summary Logic:", 14, 40);
  
  // Create Table of Transactions
  const tableBody = currentReportData.map(d => [
    new Date(d.date).toLocaleDateString(),
    d.type.toUpperCase(),
    d.note,
    (d.type === 'income' || d.type === 'expense') ? "R" + d.amount.toFixed(2) : "-"
  ]);

  doc.autoTable({
    startY: 45,
    head: [['Date', 'Type', 'Description', 'Amount']],
    body: tableBody,
    theme: 'grid',
    headStyles: { fillColor: [24, 119, 242] } // FB Blue
  });

  doc.save("Sisonke_Report.pdf");
}

function clearData() {
  if(confirm("Delete ALL history?")) {
    localStorage.removeItem("sisonkeData");
    data = [];
    document.getElementById("output").value = "";
    alert("Data cleared.");
  }
}

// Initialize correct input state
toggleAmount();
</script>

</body>
</html>
